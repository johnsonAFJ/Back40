<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5f9a3a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Back40" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Back40</title>
  </head>
  <body>
    <canvas id="farm" aria-label="Your farm. Click a tile to plow, plant or harvest. Drag to look around, scroll or pinch to zoom."></canvas>

    <div id="tooltip" class="tooltip" aria-hidden="true" hidden></div>

    <header id="hud" class="hud hud-top"></header>

    <button id="test-toggle" class="pill test-toggle" type="button" aria-controls="test-panel" aria-expanded="false" hidden>Test</button>
    <section id="test-panel" class="panel test-panel" aria-label="Test mode" hidden></section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="mode-banner" class="mode-banner" role="status" hidden></div>

    <div class="zoom-controls">
      <button id="menu-button" class="round" type="button" aria-haspopup="dialog" aria-label="Farm menu: backups" title="Farm menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
      </button>
      <button id="zoom-in" class="round" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="recenter" class="round" type="button" aria-label="Show whole farm" title="Show whole farm">⌂</button>
      <button id="zoom-out" class="round" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
    </div>

    <footer class="hud hud-bottom">
      <button id="market-button" class="pill market-button" type="button" aria-haspopup="dialog" title="Open the market"></button>
      <nav id="tools" class="tools" aria-label="Tools"></nav>
      <button id="neighbors-button" class="pill neighbors-button" type="button" aria-haspopup="dialog" title="Your neighbors and farm news">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.2" /><circle cx="16" cy="9" r="2.6" /><path d="M2.5 19c.6-3.4 2.9-5.4 5.5-5.4s4.9 2 5.5 5.4M12.8 15.2c.9-1.2 2-1.8 3.2-1.8 2.2 0 4 1.7 4.6 4.6" /></svg>
        <span>Neighbors</span>
      </button>
    </footer>

    <dialog id="market" class="panel dialog" aria-label="Market"></dialog>
    <dialog id="levelup" class="panel dialog" aria-label="Level up"></dialog>
    <dialog id="confirm" class="panel dialog" aria-label="Are you sure?"></dialog>
    <dialog id="basket" class="panel dialog" aria-label="Harvest basket"></dialog>
    <dialog id="neighbors" class="panel dialog" aria-label="Neighbors"></dialog>
    <dialog id="away" class="panel dialog" aria-label="While you were away"></dialog>
    <dialog id="notice" class="panel dialog" aria-label="This farm can't be opened"></dialog>
    <dialog id="farm-menu" class="panel dialog" aria-label="Farm menu"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
