<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5f9a3a" />
    <title>Back40</title>
  </head>
  <body>
    <canvas id="farm" aria-label="Your farm. Drag to look around, scroll or pinch to zoom."></canvas>

    <div class="hud hud-bottom">
      <output id="readout" class="pill"></output>
      <div class="zoom-controls">
        <button id="zoom-out" class="round" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <button id="recenter" class="round" type="button" aria-label="Show whole farm" title="Show whole farm">⌂</button>
        <button id="zoom-in" class="round" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
